name: Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          USE_OLLAMA: "false"
          USE_GEMINI: "false"
        run: pytest tests/ -v --ignore=tests/test_router_llm_dataflow.py
