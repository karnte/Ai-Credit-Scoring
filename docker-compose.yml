services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/storage/chroma
      - huggingface_cache:/home/appuser/.cache/huggingface
      - app_db:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Local development only — not used in production (Gemini API instead)
  ollama:
    image: ollama/ollama:latest
    profiles:
      - dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
  huggingface_cache:
  app_db:
  ollama_data:
